<!DOCTYPE html>
{% load static %}
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurslar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>


{% include 'core/navbar.html' %}
<main class="container py-5">
    <h1 class="mb-4">Barcha kurslar</h1>

    <div class="row g-4">

         {% for i in course %}
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5>{{ i.name }}</h5>
                    <p>{{ i.description }}</p>
                    <p class="text-muted">O‘qituvchi: {{i.teacher}}</p>
                    <a href="{% url 'course_detail' i.id%}" class="btn btn-primary">Kursni ochish</a>
                </div>
            </div>
        </div>
        {% endfor %}
    
    </div>
</main>


{% include 'core/footer.html' %}
</body>
</html>
