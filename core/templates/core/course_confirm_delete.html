
{% extends 'core/base.html' %}

{% block title %}Tasdiqlash | CoursePlatform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5 text-center">

                    <div class="mb-4">
                        <div class="rounded-circle bg-danger bg-opacity-10
                                    d-inline-flex align-items-center
                                    justify-content-center"
                             style="width: 80px; height: 80px;">
                            <span class="fs-1 text-danger">🗑️</span>
                        </div>
                    </div>

                    <h2 class="fw-bold mb-3">O‘chirishni tasdiqlaysizmi?</h2>

                    <p class="text-muted mb-4">
                        Siz <strong>{{ object }}</strong> elementini
                        o‘chirmoqchisiz. Bu amalni ortga qaytarib bo‘lmaydi.
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <div class="d-flex gap-3 justify-content-center">
                            <a href="{% url 'home' %}"
                               class="btn btn-outline-secondary rounded-3 px-4">
                                Bekor qilish
                            </a>

                            <button type="submit"
                                    class="btn btn-danger rounded-3 px-4">
                                O‘chirish
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
```
